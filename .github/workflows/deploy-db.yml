name: Deploy PostgreSQL → EKS

on:
  workflow_dispatch:
  push:
    branches: [ deploy ]
    paths:
      - 'db/**'
      - 'k8s/postgres-*.yaml'
      - '.github/workflows/deploy-db.yml'

env:
  AWS_REGION:  ${{ secrets.AWS_REGION }}
  EKS_CLUSTER: ${{ secrets.EKS_CLUSTER_NAME }}

jobs:
  deploy-postgres:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      # ubir postgres:16-alpine a ECR privado
      # Los nodos no tienen acceso a Docker Hub (red privada),
      # así que resubimos la imagen oficial a nuestro ECR.
      # Esta operación es idempotente: si el tag ya existe, el push
      # no hace nada relevante.
      - name: Subir postgres a ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker pull postgres:16-alpine
          docker tag postgres:16-alpine "$REGISTRY/casino-db:16-alpine"
          docker push "$REGISTRY/casino-db:16-alpine"

      - name: Instalar kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/kubectl

      - name: Conectar kubectl al clúster
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      # Reemplazar imagen en el deployment antes de aplicar
      - name: Aplicar PVC
        run: kubectl apply -f k8s/postgres-pvc.yaml

      - name: Aplicar Deployment + ConfigMap
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          sed -i "s|postgres:16-alpine|$REGISTRY/casino-db:16-alpine|g" \
            k8s/postgres-deployment.yaml
          kubectl apply -f k8s/postgres-deployment.yaml

      - name: Aplicar Service
        run: kubectl apply -f k8s/postgres-service.yaml

      - name: Esperar que Postgres esté listo
        run: |
          kubectl rollout status deployment/casino-postgres --timeout=120s
          echo "=== Estado de Postgres ==="
          kubectl get pods -l app=casino-postgres -o wide