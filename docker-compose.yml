services:
  db:
    build: ./db
    image: casino-db:latest
    container_name: casino-db
    environment:
      POSTGRES_USER: casino
      POSTGRES_PASSWORD: casino
      POSTGRES_DB: casino_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - casino-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casino -d casino_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: .
    image: casino-backend:latest
    container_name: casino-backend
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_USER: "casino"
      DB_PASSWORD: "casino"
      DB_NAME: "casino_db"
      JWT_SECRET: "cambiar_en_produccion"
      JWT_EXPIRES_IN: "8h"
      CORS_ORIGIN: "*"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - casino-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ../frontend_intro_devops_casino
    image: casino-frontend:latest
    container_name: casino-frontend
    ports:
      - "80:8080"
    environment:
      BACKEND_HOST: backend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - casino-net

networks:
  casino-net:
    driver: bridge

volumes:
  pg_data: