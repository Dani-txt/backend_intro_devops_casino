apiVersion: v1
kind: Service
metadata:
  name: casino-backend
  labels:
    app: casino-backend
spec:
  type: ClusterIP    # solo accesible dentro del clúster (nginx del frontend lo llama por este nombre)
  selector:
    app: casino-backend
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
