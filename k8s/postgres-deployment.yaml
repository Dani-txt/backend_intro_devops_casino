# ── ConfigMap: monta init.sql en /docker-entrypoint-initdb.d/ ─────────────────
# Opción B: imagen postgres:16-alpine stock. El init.sql viene del repo
# casino-backend/db/init.sql. Cópialo aquí dentro del ConfigMap.
# Postgres lo ejecuta solo la primera vez (volumen vacío).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
data:
  01-init.sql: |
    CREATE TABLE IF NOT EXISTS usuarios (
      id              SERIAL PRIMARY KEY,
      username        VARCHAR(40)  NOT NULL UNIQUE,
      email           VARCHAR(120) NOT NULL UNIQUE,
      password_hash   VARCHAR(255) NOT NULL,
      saldo           NUMERIC(12, 2) NOT NULL DEFAULT 1000.00,
      rol             VARCHAR(20)  NOT NULL DEFAULT 'jugador',
      creado_en       TIMESTAMP    NOT NULL DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS juegos (
      id          SERIAL PRIMARY KEY,
      codigo      VARCHAR(30)  NOT NULL UNIQUE,
      nombre      VARCHAR(60)  NOT NULL,
      descripcion TEXT,
      apuesta_min NUMERIC(10,2) NOT NULL DEFAULT 10,
      apuesta_max NUMERIC(10,2) NOT NULL DEFAULT 1000,
      activo      BOOLEAN      NOT NULL DEFAULT TRUE
    );

    CREATE TABLE IF NOT EXISTS transacciones (
      id          SERIAL PRIMARY KEY,
      usuario_id  INTEGER      NOT NULL REFERENCES usuarios(id) ON DELETE CASCADE,
      tipo        VARCHAR(20)  NOT NULL CHECK (tipo IN ('apuesta','premio','deposito','retiro','ajuste')),
      juego_id    INTEGER      REFERENCES juegos(id),
      monto       NUMERIC(12,2) NOT NULL,
      saldo_post  NUMERIC(12,2) NOT NULL,
      detalle     JSONB,
      creada_en   TIMESTAMP    NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_tx_usuario ON transacciones(usuario_id, creada_en DESC);
    CREATE INDEX IF NOT EXISTS idx_tx_juego   ON transacciones(juego_id);

    CREATE TABLE IF NOT EXISTS sesiones_juego (
      id          SERIAL PRIMARY KEY,
      usuario_id  INTEGER      NOT NULL REFERENCES usuarios(id) ON DELETE CASCADE,
      juego_id    INTEGER      NOT NULL REFERENCES juegos(id),
      estado      JSONB        NOT NULL,
      abierta     BOOLEAN      NOT NULL DEFAULT TRUE,
      creada_en   TIMESTAMP    NOT NULL DEFAULT NOW(),
      cerrada_en  TIMESTAMP
    );

    INSERT INTO juegos (codigo, nombre, descripcion, apuesta_min, apuesta_max) VALUES
      ('slots',     'Tragamonedas', 'Maquina de 3 rodillos con 8 simbolos.',   10, 500),
      ('roulette',  'Ruleta',       'Ruleta europea.',                          10, 1000),
      ('blackjack', 'Blackjack',    'Cartas contra la banca.',                  20, 2000)
    ON CONFLICT (codigo) DO NOTHING;

---
#Deployment de PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: casino-postgres
  labels:
    app: casino-postgres
spec:
  replicas: 1          # IMPORTANTE: solo 1 réplica; PVC con ReadWriteOnce no admite más
  selector:
    matchLabels:
      app: casino-postgres
  template:
    metadata:
      labels:
        app: casino-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: casino-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: casino-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: casino-secrets
                  key: DB_NAME

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/

          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "casino", "-d", "casino_db"]
            initialDelaySeconds: 20
            periodSeconds: 10

          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "casino", "-d", "casino_db"]
            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

      volumes:
        - name: postgres-data
          emptyDir: {}
        - name: init-sql
          configMap:
            name: postgres-init-sql
