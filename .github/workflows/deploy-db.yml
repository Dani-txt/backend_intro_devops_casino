name: Deploy PostgreSQL → EKS

# Solo se dispara cuando cambia algo relacionado a la BD
on:
  workflow_dispatch:
  push:
    branches: [ deploy ]
    paths:
      - 'db/**'
      - 'k8s/postgres-*.yaml'
      - '.github/workflows/deploy-db.yml'

env:
  AWS_REGION:  ${{ secrets.AWS_REGION }}
  EKS_CLUSTER: ${{ secrets.EKS_CLUSTER }}

jobs:
  deploy-postgres:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Instalar kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/kubectl

      - name: Conectar kubectl al clúster
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      # ── Aplicar manifiestos de Postgres (idempotente) ─────────────
      # No construimos imagen: usamos postgres:16-alpine stock.
      # El init.sql va embebido en el ConfigMap dentro de postgres-deployment.yaml.
      # kubectl apply es seguro de correr múltiples veces: no reinicia
      # el pod si los manifiestos no cambiaron.
      - name: Aplicar PVC
        run: kubectl apply -f k8s/postgres-pvc.yaml

      - name: Aplicar Deployment + ConfigMap
        run: kubectl apply -f k8s/postgres-deployment.yaml

      - name: Aplicar Service
        run: kubectl apply -f k8s/postgres-service.yaml

      - name: Esperar que Postgres esté listo
        run: |
          kubectl rollout status deployment/casino-postgres --timeout=120s
          echo "=== Estado de Postgres ==="
          kubectl get pods -l app=casino-postgres -o wide
